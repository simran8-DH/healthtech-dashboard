# Render Blueprint — permanent free API (no tunnel)
# https://dashboard.render.com → New → Blueprint → connect this repo

services:
  - type: web
    name: healthtech-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_SAMPLES
        value: "false"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      # Paste from Neon after creating free project
      - key: DATABASE_URL
        sync: false
      # Your GitHub Pages URL
      - key: FRONTEND_URL
        value: https://simran8-dh.github.io
